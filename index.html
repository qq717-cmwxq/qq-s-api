<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的专属站点库</title>
    <style>
        /* 基础设置与配色：淡蓝与淡粉简约风 */
        :root {
            --bg-color: #f4f8fb; 
            --card-bg: #ffffff;
            --primary-blue: #a3c9e6;
            --primary-pink: #f5b8c4;
            --text-main: #4a5568;
            --text-light: #8895a7;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; padding-bottom: 80px; }

        /* 顶部标题 */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
        h1 { font-size: 22px; color: var(--primary-blue); text-shadow: 1px 1px 2px rgba(163,201,230,0.3); }

        /* 添加按钮 */
        .btn-add { background: var(--primary-pink); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(245,184,196,0.4); cursor: pointer; }
        .btn-add:active { transform: scale(0.95); }

        /* 站点卡片 */
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border-left: 5px solid var(--primary-blue); position: relative; transition: all 0.3s; }
        .card.pink-border { border-left-color: var(--primary-pink); }
        
        /* 卡片标题和链接 */
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #edf2f7; padding-bottom: 10px; }
        .site-name { font-size: 18px; font-weight: 600; color: #2d3748; }
        .site-link { font-size: 12px; color: var(--primary-blue); text-decoration: none; background: #eef7fc; padding: 4px 10px; border-radius: 12px; display: inline-block; margin-top: 5px; word-break: break-all; }
        
        /* 信息列表 */
        .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .info-label { color: var(--text-light); }
        .info-value { font-weight: 500; }
        .balance { color: #e53e3e; font-weight: bold; font-size: 16px; }
        .remark { font-size: 13px; color: #718096; background: #f7fafc; padding: 8px; border-radius: 8px; margin-top: 10px; margin-bottom: 10px; word-break: break-all; }

        /* 操作按钮区 */
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-small { background: none; border: 1px solid #e2e8f0; color: var(--text-light); padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .btn-edit { border-color: var(--primary-blue); color: var(--primary-blue); }
        .btn-delete { border-color: var(--primary-pink); color: var(--primary-pink); }

        /* 弹窗表单 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(3px); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-height: 90vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; background: #f8fafc; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-blue); background: white; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        
        /* 弹窗底部按钮 */
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; padding-bottom: 20px; }
        .btn-cancel { flex: 1; background: #edf2f7; color: var(--text-light); border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; }
        .btn-save { flex: 2; background: var(--primary-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; }
        
        /* 签到状态提示 */
        .sign-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .status-yes { background: #e6fffa; color: #38b2ac; }
        .status-no { background: #fffaf0; color: #d69e2e; }

        /* 空状态 */
        .empty-state { text-align: center; color: var(--text-light); margin-top: 50px; font-size: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>🌸 我的专属站点</h1>
        <button class="btn-add" onclick="openModal()">+ 添加</button>
    </header>

    <div id="siteList">
        <!-- 站点列表将在这里生成 -->
    </div>

    <!-- 添加/编辑 弹窗 -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px; font-size: 18px; color: var(--primary-blue);">添加新站点</h2>
            
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>站点名称 *</label>
                <input type="text" id="siteName" placeholder="例如：某某网">
            </div>
            
            <div class="form-group">
                <label>站点链接 (URL)</label>
                <input type="url" id="siteUrl" placeholder="https://...">
            </div>
            
            <div class="form-group">
                <label>今天是否已签到？</label>
                <select id="isSigned" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; background: #f8fafc;">
                    <option value="否">还没签到</option>
                    <option value="是">已签到 ✅</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>签到条件 / 限制</label>
                <input type="text" id="signCondition" placeholder="例如：需满10元 / 每天一次">
            </div>
            
            <div class="form-group">
                <label>当前余额 / 积分</label>
                <input type="text" id="balance" placeholder="例如：25.5">
            </div>
            
            <div class="form-group">
                <label>额外备注</label>
                <textarea id="remark" placeholder="记点什么..."></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveSite()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化数据
        let sites = JSON.parse(localStorage.getItem('mySites')) || [];
        let isEditing = false;

        // 渲染页面
        function renderSites() {
            const list = document.getElementById('siteList');
            list.innerHTML = '';

            if (sites.length === 0) {
                list.innerHTML = '<div class="empty-state">还没有站点哦，点击右上角添加吧~</div>';
                return;
            }

            sites.forEach((site, index) => {
                const isPink = index % 2 !== 0; // 交替边框颜色
                const signStatus = site.isSigned === '是' ? '<span class="sign-status status-yes">已签到</span>' : '<span class="sign-status status-no">未签到</span>';
                
                const card = document.createElement('div');
                card.className = `card ${isPink ? 'pink-border' : ''}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="site-name">${site.name}</div>
                            ${site.url ? `<a href="${site.url.startsWith('http') ? site.url : 'https://' + site.url}" target="_blank" class="site-link">🔗 点击访问</a>` : ''}
                        </div>
                    </div>
                    <div class="info-row">
                        <span class="info-label">签到状态</span>
                        <span class="info-value">${signStatus}</span>
                    </div>
                    ${site.condition ? `
                    <div class="info-row">
                        <span class="info-label">签到条件</span>
                        <span class="info-value" style="color: #d69e2e;">${site.condition}</span>
                    </div>` : ''}
                    <div class="info-row">
                        <span class="info-label">当前余额</span>
                        <span class="info-value balance">${site.balance || '0'}</span>
                    </div>
                    ${site.remark ? `<div class="remark">备注：${site.remark}</div>` : ''}
                    
                    <div class="actions">
                        <button class="btn-small btn-edit" onclick="editSite(${index})">编辑</button>
                        <button class="btn-small btn-delete" onclick="deleteSite(${index})">删除</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // 打开弹窗
        function openModal() {
            isEditing = false;
            document.getElementById('modalTitle').innerText = '添加新站点';
            document.getElementById('editId').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            document.getElementById('isSigned').value = '否';
            document.getElementById('signCondition').value = '';
            document.getElementById('balance').value = '';
            document.getElementById('remark').value = '';
            document.getElementById('formModal').style.display = 'flex';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        // 保存站点
        function saveSite() {
            const name = document.getElementById('siteName').value.trim();
            if (!name) {
                alert('站点名称不能为空哦！');
                return;
            }

            const siteData = {
                name: name,
                url: document.getElementById('siteUrl').value.trim(),
                isSigned: document.getElementById('isSigned').value,
                condition: document.getElementById('signCondition').value.trim(),
                balance: document.getElementById('balance').value.trim(),
                remark: document.getElementById('remark').value.trim()
            };

            if (isEditing) {
                const id = document.getElementById('editId').value;
                sites[id] = siteData;
            } else {
                sites.push(siteData);
            }

            localStorage.setItem('mySites', JSON.stringify(sites));
            closeModal();
            renderSites();
        }

        // 编辑站点
        function editSite(index) {
            isEditing = true;
            const site = sites[index];
            
            document.getElementById('modalTitle').innerText = '编辑站点';
            document.getElementById('editId').value = index;
            document.getElementById('siteName').value = site.name;
            document.getElementById('siteUrl').value = site.url || '';
            document.getElementById('isSigned').value = site.isSigned || '否';
            document.getElementById('signCondition').value = site.condition || '';
            document.getElementById('balance').value = site.balance || '';
            document.getElementById('remark').value = site.remark || '';
            
            document.getElementById('formModal').style.display = 'flex';
        }

        // 删除站点
        function deleteSite(index) {
            if (confirm('确定要删除这个站点吗？')) {
                sites.splice(index, 1);
                localStorage.setItem('mySites', JSON.stringify(sites));
                renderSites();
            }
        }

        // 首次加载渲染
        renderSites();
    </script>
</body>
</html>
