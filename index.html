<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>qiuqiuのapi 🍎🍏</title>
    <style>
        :root {
            /* 红绿苹果主题色 */
            --apple-green: #7bc970;
            --apple-green-light: #eaf7e8;
            --apple-red: #ff7b7b;
            --apple-red-light: #ffebeb;
            --text-main: #4a3e3e;
            --text-light: #9a8c8c;
            --bg-color: #fcf8f5; /* 奶油白底色 */
            --card-bg: #ffffff;
            --shadow: 0 8px 24px rgba(255, 123, 123, 0.12);
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            /* 采用更圆润可爱的系统字体 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; 
        }
        
        body { 
            /* 奶油底色 + 淡淡的红绿氛围 */
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(123, 201, 112, 0.08) 0%, transparent 30%),
                              radial-gradient(circle at 90% 80%, rgba(255, 123, 123, 0.08) 0%, transparent 30%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 20px 15px; 
            padding-bottom: 100px; 
            min-height: 100vh;
        }

        /* 顶部标题 */
        header { margin-bottom: 25px; padding: 0 5px; text-align: center; }
        h1 { 
            font-size: 28px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            color: var(--apple-red);
            text-shadow: 2px 2px 0px var(--apple-green-light), 4px 4px 0px rgba(255,123,123,0.2);
            position: relative;
            display: inline-block;
        }
        /* 标题上的小叶子 */
        h1::before {
            content: '🌱';
            font-size: 20px;
            position: absolute;
            top: -10px;
            left: -15px;
            transform: rotate(-20deg);
        }

        /* 悬浮添加按钮 */
        .fab { 
            position: fixed; bottom: 30px; right: 20px; 
            width: 65px; height: 65px; border-radius: 50%; 
            background: linear-gradient(135deg, var(--apple-red), #ff9a9a); 
            color: white; font-size: 32px; line-height: 65px; text-align: center; 
            box-shadow: 0 6px 20px rgba(255, 123, 123, 0.5); 
            border: 4px solid white;
            cursor: pointer; z-index: 99;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.9) rotate(90deg); }

        /* 卡片样式 */
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; /* 更圆润 */
            margin-bottom: 20px; 
            box-shadow: var(--shadow); 
            position: relative; 
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid #fff; /* 白色包边 */
        }
        /* 卡片顶部：红绿渐变条 */
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, var(--apple-green) 0%, #a8e063 50%, var(--apple-red) 100%);
            z-index: 10;
        }
        
        /* 头部（支持点击折叠） */
        .card-header { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px 20px; cursor: pointer; user-select: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(252,248,245,0.5) 100%);
        }
        .header-left { display: flex; flex-direction: column; gap: 8px; }
        .site-name { 
            font-size: 20px; 
            font-weight: 800; 
            color: #3d2e2e; 
            letter-spacing: 0.5px;
        }
        
        /* 苹果折叠图标 */
        .toggle-icon { 
            font-size: 24px; 
            transition: transform 0.3s ease; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        }
        .card.collapsed .toggle-icon { transform: scale(0.9) rotate(-10deg); }
        
        /* 内容区（可折叠） */
        .card-body {
            padding: 0 20px 20px 20px;
            display: block;
            animation: fadeIn 0.4s ease;
        }
        .card.collapsed .card-body { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 链接行 */
        .link-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; border-bottom: 2px dashed var(--apple-green-light); padding-bottom: 15px;}
        .site-link { 
            font-size: 13px; color: var(--apple-green); text-decoration: none; 
            background: var(--apple-green-light); padding: 8px 14px; 
            border-radius: 12px; font-weight: 700;
            border: 1px solid #d0ebcd;
        }
        
        /* 复制按钮 */
        .btn-copy { 
            background: #f4f4f4; border: 1px solid #e0e0e0; color: #888; 
            padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            white-space: nowrap;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            flex-shrink: 0;
            box-shadow: 0 2px 0 #e0e0e0;
        }
        .btn-copy:active { background: #eaeaea; transform: translateY(2px); box-shadow: none; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 14px; }
        .info-label { color: var(--text-light); font-weight: 700; font-size: 13px; flex-shrink: 0;}
        .info-value { font-weight: 800; color: #5a4b4b; }
        .balance { color: var(--apple-red); font-weight: 900; font-size: 20px; }

        /* ======= 苹果造型滑动开关 ======= */
        .switch-container {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            background: #fdfafa; padding: 4px 10px 4px 14px; border-radius: 20px;
            border: 2px solid #f0e6e6;
        }
        .switch-text {
            font-size: 13px; font-weight: 800; transition: color 0.3s;
        }
        .switch-text.unsigned { color: #d08e8e; }
        .switch-text.signed { color: var(--apple-green); }

        .toggle-switch {
            position: relative; width: 54px; height: 30px;
            background-color: #e8d8d8; /* 默认灰色 */
            border-radius: 30px; transition: background-color 0.3s;
            flex-shrink: 0;
        }
        /* 滑块做成果绿色 */
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 26px; height: 26px; background-color: white;
            border-radius: 50%; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
        }
        /* 激活状态 */
        .toggle-switch.active { background-color: var(--apple-green); }
        .toggle-switch.active::after { transform: translateX(24px); }
        /* ============================= */

        /* URL 专属区域 */
        .url-box {
            background: var(--apple-red-light); border: 2px dashed #ffc8c8;
            border-radius: 16px; padding: 12px 14px;
            margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .url-info { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .url-label { font-size: 12px; color: var(--apple-red); font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;}
        .url-label::before { content: '🔗'; font-size: 12px;}
        .url-text { font-size: 13px; color: #8c5e5e; word-break: break-all; font-weight: 600;}

        /* 好吃模型 */
        .model-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .model-item {
            background: linear-gradient(135deg, #f0fbf0 0%, #dcf5dc 100%);
            border: 2px solid #c2ebc2;
            border-radius: 16px; padding: 12px 14px;
            display: flex; justify-content: space-between; align-items: center;
            word-break: break-all;
            box-shadow: 0 2px 8px rgba(123, 201, 112, 0.1);
        }
        .model-name { font-size: 14px; color: #3e6b3e; font-weight: 700; display: flex; align-items: center; gap: 6px;}
        .model-name::before { content: '🍏'; }
        .model-price { font-size: 13px; color: #fff; font-weight: 800; background: var(--apple-red); padding: 3px 10px; border-radius: 10px; box-shadow: 0 2px 0 #d15a5a;}

        /* 普通备注 */
        .remark-box { background: #fdf6f6; border-radius: 16px; padding: 14px; margin-bottom: 15px; border: 1px solid #f5e5e5;}
        .remark-label { font-size: 12px; color: #b08a8a; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 4px;}
        .remark-label::before { content: '📝'; font-size: 12px;}
        .remark-text { font-size: 13px; color: #6e5b5b; line-height: 1.6; word-break: break-all;}

        .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 15px;}
        .btn-small { 
            background: white; border: 2px solid #e0e0e0; color: #888; 
            padding: 8px 18px; border-radius: 14px; font-size: 14px; font-weight: 800; 
            cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 0 #e0e0e0;
        }
        .btn-small:active { transform: translateY(2px); box-shadow: none; }
        .btn-edit { border-color: var(--apple-green); color: var(--apple-green); box-shadow: 0 2px 0 var(--apple-green); }
        .btn-delete { border-color: var(--apple-red); color: var(--apple-red); box-shadow: 0 2px 0 var(--apple-red); }

        /* 弹窗表单 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: flex-end; }
        .modal-content { background: #ffffff; width: 100%; max-height: 90vh; border-radius: 30px 30px 0 0; padding: 30px 25px; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-top: 6px solid var(--apple-green); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #777; margin-bottom: 8px; font-weight: 800; }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 16px; 
            font-size: 15px; outline: none; background: #fafafa; transition: border 0.2s; color: #444;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--apple-green); background: white; }
        .form-group textarea { resize: vertical; min-height: 90px; }

        /* 动态表单行 */
        .dynamic-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-model { flex: 2; }
        .input-price { flex: 1; }
        .btn-remove-model { background: var(--apple-red-light); color: var(--apple-red); border: none; padding: 0 16px; border-radius: 16px; font-weight: bold; font-size: 20px; cursor: pointer; }
        .btn-add-model { background: var(--apple-green-light); color: var(--apple-green); border: 2px dashed #a8e063; padding: 14px; border-radius: 16px; font-size: 14px; font-weight: 800; width: 100%; cursor: pointer; margin-bottom: 20px;}
        
        .modal-actions { display: flex; gap: 15px; margin-top: 30px; padding-bottom: 20px; }
        .btn-cancel { flex: 1; background: #f0f0f0; color: #888; border: none; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 800; }
        .btn-save { flex: 2; background: var(--apple-green); color: white; border: none; padding: 16px; border-radius: 18px; font-size: 16px; font-weight: 800; box-shadow: 0 4px 0 #5ba352; transition: all 0.2s;}
        .btn-save:active { transform: translateY(4px); box-shadow: none;}

        .empty-state { text-align: center; color: var(--text-light); margin-top: 80px; font-size: 15px; font-weight: 600;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>qiuqiuのapi</h1>
    </header>

    <div id="siteList"></div>

    <button class="fab" onclick="openModal()">+</button>

    <!-- 添加/编辑 弹窗 -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 25px; font-size: 22px; text-align: center; color: var(--apple-green); font-weight: 900;">添加新站点</h2>
            
            <input type="hidden" id="editId">
            
            <div class="form-group">
                <label>站点名称 *</label>
                <input type="text" id="siteName" placeholder="例如：某某网">
            </div>
            
            <div class="form-group">
                <label>站点链接（用于点击访问）</label>
                <input type="url" id="siteUrl" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>是否支持签到？</label>
                <select id="supportSign" onchange="toggleSignOptions()">
                    <option value="是">支持签到</option>
                    <option value="否">不支持签到</option>
                </select>
            </div>

            <div id="signDetailGroup" class="form-group">
                <label>今日是否已签到？</label>
                <select id="isSigned">
                    <option value="否">还没签到</option>
                    <option value="是">已签到 ✅</option>
                </select>
            </div>
            
            <div id="conditionGroup" class="form-group">
                <label>签到条件 / 限制</label>
                <input type="text" id="signCondition" placeholder="例如：需满10元 / 每天一次">
            </div>
            
            <div class="form-group">
                <label>当前余额 / 积分</label>
                <input type="text" id="balance" placeholder="例如：25.5">
            </div>

            <div class="form-group" style="background: var(--apple-red-light); padding: 15px; border-radius: 16px; border: 2px dashed #ffc8c8;">
                <label style="color: var(--apple-red);">专属 URL（提取用）</label>
                <input type="text" id="customUrl" placeholder="用于复制，不是点击访问的链接" style="background: white; border-color: transparent;">
            </div>

            <!-- 动态好吃模型 + 价格 -->
            <div class="form-group" style="margin-top: 25px;">
                <label style="color: var(--apple-green);">🍏 好吃模型列表</label>
                <div id="modelContainer"></div>
                <button type="button" class="btn-add-model" onclick="addModelInput()">+ 添加一个模型</button>
            </div>
            
            <div class="form-group">
                <label>额外备注</label>
                <textarea id="remark" placeholder="记点什么..."></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-save" onclick="saveSite()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 升级 V6 版本（苹果风）
        let sites = JSON.parse(localStorage.getItem('mySitesV6')) || []; 
        let isEditing = false;

        function toggleSignOptions() {
            const isSupport = document.getElementById('supportSign').value === '是';
            document.getElementById('signDetailGroup').classList.toggle('hidden', !isSupport);
            document.getElementById('conditionGroup').classList.toggle('hidden', !isSupport);
        }

        function addModelInput(name = '', price = '') {
            const container = document.getElementById('modelContainer');
            const div = document.createElement('div');
            div.className = 'dynamic-row';
            div.innerHTML = `
                <input type="text" class="input-model model-name-input" value="${name}" placeholder="模型名称">
                <input type="text" class="input-price model-price-input" value="${price}" placeholder="价格">
                <button type="button" class="btn-remove-model" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(div);
        }

        function renderSites() {
            const list = document.getElementById('siteList');
            list.innerHTML = '';

            if (sites.length === 0) {
                list.innerHTML = '<div class="empty-state">空空如也~ 点击右下角 🍎 添加吧</div>';
                return;
            }

            sites.forEach((site, index) => {
                let signHtml = '';
                if (site.supportSign === '是') {
                    const isSigned = site.isSigned === '是';
                    const textClass = isSigned ? 'signed' : 'unsigned';
                    const textStr = isSigned ? '已签到' : '未签到';
                    const switchActive = isSigned ? 'active' : '';
                    
                    signHtml = `
                    <div class="info-row">
                        <span class="info-label">签到状态</span>
                        <div class="switch-container" onclick="event.stopPropagation(); toggleSign(${index})">
                            <span class="switch-text ${textClass}">${textStr}</span>
                            <div class="toggle-switch ${switchActive}"></div>
                        </div>
                    </div>
                    ${site.condition ? `
                    <div class="info-row">
                        <span class="info-label">签到条件</span>
                        <span class="info-value" style="color: #c48282; font-size: 13px;">${site.condition}</span>
                    </div>` : ''}
                    `;
                }

                let modelHtml = '';
                if (site.foodModels && site.foodModels.length > 0) {
                    const models = site.foodModels.map(m => `
                        <div class="model-item">
                            <span class="model-name">${m.name}</span>
                            ${m.price ? `<span class="model-price">💰 ${m.price}</span>` : ''}
                        </div>
                    `).join('');
                    if(models) modelHtml = `<div class="model-grid">${models}</div>`;
                }

                let urlHtml = '';
                if (site.customUrl) {
                    urlHtml = `
                    <div class="url-box">
                        <div class="url-info">
                            <div class="url-label">专属 URL</div>
                            <div class="url-text">${site.customUrl}</div>
                        </div>
                        <button class="btn-copy" onclick="event.stopPropagation(); copyText('${site.customUrl}', this)">📋 复制</button>
                    </div>`;
                }

                const remarkHtml = site.remark ? `
                    <div class="remark-box">
                        <div class="remark-label">备注信息</div>
                        <div class="remark-text">${site.remark}</div>
                    </div>
                ` : '';

                const card = document.createElement('div');
                const isCollapsed = site.isCollapsed ? 'collapsed' : '';
                card.className = `card ${isCollapsed}`;
                
                // 苹果图标切换
                const appleIcon = isCollapsed ? '🍎' : '🍏';
                
                card.innerHTML = `
                    <div class="card-header" onclick="toggleCollapse(${index})">
                        <div class="header-left">
                            <div class="site-name">${site.name}</div>
                        </div>
                        <div class="toggle-icon">${appleIcon}</div>
                    </div>
                    
                    <div class="card-body">
                        <div class="link-row">
                            ${site.url ? `
                            <a href="${site.url.startsWith('http') ? site.url : 'https://' + site.url}" target="_blank" class="site-link">🔗 点击访问</a>
                            <button class="btn-copy" onclick="event.stopPropagation(); copyText('${site.url}', this)">📋 复制链接</button>
                            ` : ''}
                        </div>
                        
                        ${signHtml}
                        
                        <div class="info-row">
                            <span class="info-label">当前余额</span>
                            <span class="info-value balance">${site.balance || '0'}</span>
                        </div>

                        ${urlHtml}
                        ${modelHtml}
                        ${remarkHtml}
                        
                        <div class="actions">
                            <button class="btn-small btn-edit" onclick="event.stopPropagation(); editSite(${index})">编辑</button>
                            <button class="btn-small btn-delete" onclick="event.stopPropagation(); deleteSite(${index})">删除</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function toggleSign(index) {
            sites[index].isSigned = sites[index].isSigned === '是' ? '否' : '是';
            localStorage.setItem('mySitesV6', JSON.stringify(sites));
            renderSites(); 
        }

        function toggleCollapse(index) {
            sites[index].isCollapsed = !sites[index].isCollapsed;
            localStorage.setItem('mySitesV6', JSON.stringify(sites));
            renderSites();
        }

        function copyText(text, btnElement) {
            let copyStr = text;
            if (!text.startsWith('http') && text.includes('.')) {
                copyStr = 'https://' + text;
            }

            navigator.clipboard.writeText(copyStr).then(() => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '🍏 已复制';
                btnElement.style.color = 'var(--apple-green)';
                btnElement.style.background = 'var(--apple-green-light)';
                btnElement.style.borderColor = '#c2ebc2';
                setTimeout(() => {
                    btnElement.innerHTML = originalHTML;
                    btnElement.style.color = '';
                    btnElement.style.background = '';
                    btnElement.style.borderColor = '';
                }, 1500);
            }).catch(err => {
                alert('复制失败，请手动长按复制');
            });
        }

        function openModal() {
            isEditing = false;
            document.getElementById('modalTitle').innerText = '添加新站点';
            document.getElementById('editId').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            document.getElementById('supportSign').value = '是';
            document.getElementById('isSigned').value = '否';
            document.getElementById('signCondition').value = '';
            document.getElementById('balance').value = '';
            document.getElementById('customUrl').value = '';
            document.getElementById('remark').value = '';
            
            document.getElementById('modelContainer').innerHTML = '';
            addModelInput();

            toggleSignOptions(); 
            document.getElementById('formModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('formModal').style.display = 'none';
        }

        function saveSite() {
            const name = document.getElementById('siteName').value.trim();
            if (!name) {
                alert('站点名称不能为空哦！');
                return;
            }

            const modelNames = document.querySelectorAll('.model-name-input');
            const modelPrices = document.querySelectorAll('.model-price-input');
            
            let foodModels = [];
            for (let i = 0; i < modelNames.length; i++) {
                const mName = modelNames[i].value.trim();
                const mPrice = modelPrices[i].value.trim();
                if (mName || mPrice) {
                    foodModels.push({ name: mName || '未命名', price: mPrice });
                }
            }

            const siteData = {
                name: name,
                url: document.getElementById('siteUrl').value.trim(),
                supportSign: document.getElementById('supportSign').value,
                isSigned: document.getElementById('isSigned').value,
                condition: document.getElementById('signCondition').value.trim(),
                balance: document.getElementById('balance').value.trim(),
                customUrl: document.getElementById('customUrl').value.trim(),
                foodModels: foodModels,
                remark: document.getElementById('remark').value.trim(),
                isCollapsed: isEditing ? sites[document.getElementById('editId').value].isCollapsed : false 
            };

            if (isEditing) {
                sites[document.getElementById('editId').value] = siteData;
            } else {
                sites.push(siteData);
            }

            localStorage.setItem('mySitesV6', JSON.stringify(sites));
            closeModal();
            renderSites();
        }

        function editSite(index) {
            isEditing = true;
            const site = sites[index];
            
            document.getElementById('modalTitle').innerText = '编辑站点';
            document.getElementById('editId').value = index;
            document.getElementById('siteName').value = site.name;
            document.getElementById('siteUrl').value = site.url || '';
            document.getElementById('supportSign').value = site.supportSign || '是';
            document.getElementById('isSigned').value = site.isSigned || '否';
            document.getElementById('signCondition').value = site.condition || '';
            document.getElementById('balance').value = site.balance || '';
            document.getElementById('customUrl').value = site.customUrl || '';
            document.getElementById('remark').value = site.remark || '';
            
            document.getElementById('modelContainer').innerHTML = '';
            if (site.foodModels && site.foodModels.length > 0) {
                site.foodModels.forEach(m => addModelInput(m.name, m.price));
            } else {
                addModelInput();
            }
            
            toggleSignOptions();
            document.getElementById('formModal').style.display = 'flex';
        }

        function deleteSite(index) {
            if (confirm('确定要删除这个站点吗？')) {
                sites.splice(index, 1);
                localStorage.setItem('mySitesV6', JSON.stringify(sites));
                renderSites();
            }
        }

        renderSites();
    </script>
</body>
</html>
